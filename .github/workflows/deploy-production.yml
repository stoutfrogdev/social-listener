name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PRODUCTION to confirm deployment'
        required: true
        type: string

jobs:
  validate:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "PRODUCTION" ]; then
            echo "❌ Invalid confirmation. You must type 'PRODUCTION' exactly to deploy."
            exit 1
          fi
          echo "✅ Confirmation accepted"

  test:
    name: Run Tests
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run type check
        run: npm run type-check --if-present

      - name: Run tests
        run: npm run test --if-present

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY_PROD }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN_PROD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t social-listener-platform:production -f docker/Dockerfile .

      # Add your production deployment steps here
      # Examples:
      # - Push to container registry
      # - Deploy to Cloud Run
      # - Deploy to GKE

      - name: Production deployment placeholder
        run: |
          echo "🚀 Deploying to PRODUCTION environment..."
          echo "Docker image built: social-listener-platform:production"
          echo "Add your deployment commands here (e.g., push to GCR, deploy to Cloud Run)"
          echo "✅ Production deployment complete"

      - name: Notify deployment complete
        run: |
          echo "=========================================="
          echo "✅ PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Deployed by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u)"
          echo "=========================================="
